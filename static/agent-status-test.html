<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Status API 测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; color: #f8fafc; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
  .card { background: #1e2130; border: 1px solid #2d3148; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 13px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
  input[type=text] {
    background: #0f1117; border: 1px solid #2d3148; border-radius: 6px;
    color: #e2e8f0; font-size: 13px; padding: 7px 10px; width: 260px; outline: none;
  }
  input[type=text]:focus { border-color: #6366f1; }
  input[type=number] {
    background: #0f1117; border: 1px solid #2d3148; border-radius: 6px;
    color: #e2e8f0; font-size: 13px; padding: 7px 10px; width: 90px; outline: none;
  }
  button {
    background: #6366f1; color: #fff; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 500; padding: 8px 16px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #4f46e5; }
  button.secondary { background: #2d3148; color: #94a3b8; }
  button.secondary:hover { background: #374151; color: #e2e8f0; }
  button.danger { background: #7f1d1d; color: #fca5a5; }
  button.danger:hover { background: #991b1b; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 99px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge-running { background: #14532d; color: #86efac; }
  .badge-idle    { background: #1e2130; color: #64748b; border: 1px solid #2d3148; }
  .badge-hermes  { background: #1e3a5f; color: #93c5fd; }
  .badge-openclaw{ background: #3b1f5e; color: #c4b5fd; }
  .status-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #0f1117; border-radius: 6px; margin-bottom: 12px; font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
  .dot.active { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .agent-card {
    background: #0f1117; border: 1px solid #2d3148; border-radius: 8px;
    padding: 16px; margin-bottom: 10px;
  }
  .agent-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .agent-header .stream-id { font-size: 12px; color: #64748b; font-family: monospace; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .stat { background: #1e2130; border-radius: 6px; padding: 10px 12px; }
  .stat-label { font-size: 11px; color: #64748b; margin-bottom: 3px; }
  .stat-value { font-size: 16px; font-weight: 600; color: #f1f5f9; font-family: monospace; }
  .stat-value.highlight { color: #86efac; }
  .empty-state { text-align: center; padding: 32px; color: #475569; font-size: 14px; }
  pre {
    background: #0f1117; border: 1px solid #2d3148; border-radius: 6px;
    padding: 14px; font-size: 12px; color: #94a3b8; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .auto-row { display: flex; align-items: center; gap: 10px; }
  .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0; background: #2d3148;
    border-radius: 20px; transition: .2s;
  }
  .slider:before {
    content: ''; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px;
    background: #64748b; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: #4f46e5; }
  input:checked + .slider:before { transform: translateX(16px); background: #fff; }
  .log { font-size: 11px; color: #475569; margin-top: 8px; max-height: 80px; overflow-y: auto; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #1e2130; }
  .log-entry.ok { color: #86efac; }
  .log-entry.err { color: #fca5a5; }
  .section-sep { border: none; border-top: 1px solid #2d3148; margin: 16px 0; }
  /* Overview table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase;
       letter-spacing: 0.05em; padding: 6px 10px; border-bottom: 1px solid #2d3148; }
  td { padding: 8px 10px; border-bottom: 1px solid #1a1d2e; vertical-align: middle; color: #cbd5e1; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1a1d2e; }
  td.mono { font-family: monospace; font-size: 12px; color: #94a3b8; }
  td.clickable { cursor: pointer; color: #818cf8; text-decoration: underline; text-underline-offset: 2px; }
  td.clickable:hover { color: #a5b4fc; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; font-weight: 500; }
  .pill-hermes   { background: #1e3a5f; color: #93c5fd; }
  .pill-openclaw { background: #3b1f5e; color: #c4b5fd; }
  .pill-none     { background: #1e2130; color: #475569; border: 1px solid #2d3148; }
  .pill-active   { background: #14532d; color: #86efac; }
  .pill-idle     { background: #1e2130; color: #64748b; border: 1px solid #2d3148; }
  .tabs { display: flex; gap: 2px; margin-bottom: 16px; }
  .tab { padding: 6px 14px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer;
         color: #64748b; background: transparent; border: none; }
  .tab.active { background: #2d3148; color: #e2e8f0; }
  .tab:hover:not(.active) { color: #94a3b8; }
  /* Session detail panel */
  .sess-detail { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 16px; margin-top: 12px; }
  .sess-detail-title { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .field-row { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; font-size: 13px; }
  .field-key { color: #64748b; min-width: 120px; font-size: 12px; flex-shrink: 0; }
  .field-val { color: #e2e8f0; font-family: monospace; font-size: 12px; word-break: break-all; }
  .field-val.copy-btn { cursor: pointer; color: #818cf8; }
  .field-val.copy-btn:hover { color: #a5b4fc; }
  .source-tag { font-size: 10px; color: #475569; background: #1e2130; border: 1px solid #2d3148; border-radius: 4px; padding: 1px 5px; margin-left: 6px; font-family: monospace; }
  .msg-preview { max-height: 160px; overflow-y: auto; margin-top: 8px; }
  .msg-row { padding: 5px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; line-height: 1.5; }
  .msg-row.user { background: #1e2130; color: #93c5fd; }
  .msg-row.assistant { background: #14532d22; color: #86efac; }
  .msg-role { font-size: 10px; font-weight: 600; text-transform: uppercase; opacity: 0.6; margin-bottom: 2px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .filter-row input { background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; color: #e2e8f0; font-size: 12px; padding: 5px 9px; outline: none; width: 200px; }
  .filter-row input:focus { border-color: #6366f1; }
  .filter-row select { background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; color: #e2e8f0; font-size: 12px; padding: 5px 9px; outline: none; }
  .copy-toast { position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .copy-toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>Agent Status API 测试</h1>
<p class="subtitle">实时查询 Agent / Stream / Session 状态，支持 Hermes 和 OpenClaw</p>

<!-- Status bar -->
<div class="status-bar">
  <div class="dot" id="connDot"></div>
  <span id="connText" style="color:#64748b">未连接</span>
  <span style="margin-left:auto;font-size:11px;color:#475569" id="lastUpdate"></span>
</div>

<!-- Overview: all sessions/streams/employees -->
<div class="card">
  <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
    总览
    <button class="secondary" style="padding:4px 12px;font-size:12px" onclick="loadOverview()">刷新总览</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('employees',this)">数字员工</button>
    <button class="tab" onclick="switchTab('sessions',this)">会话列表</button>
    <button class="tab" onclick="switchTab('streams',this)">活跃 Stream</button>
  </div>
  <div id="tabEmployees"><div class="empty-state">点击"刷新总览"加载</div></div>
  <div id="tabSessions" style="display:none"><div class="empty-state">点击"刷新总览"加载</div></div>
  <div id="tabStreams" style="display:none"><div class="empty-state">点击"刷新总览"加载</div></div>
</div>

<div id="copyToast" class="copy-toast">已复制</div>

<!-- Query controls -->
<div class="card" id="queryCard">
  <div class="card-title">查询活跃 Agent 状态（/api/agent/status）</div>
  <div class="row">
    <div>
      <label>stream_id（可选）</label>
      <input type="text" id="filterStream" placeholder="留空查询所有">
    </div>
    <div>
      <label>session_id（可选）</label>
      <input type="text" id="filterSession" placeholder="留空查询所有">
    </div>
    <button onclick="fetchStatus()">查询</button>
    <button class="secondary" onclick="clearFilters()">清空筛选</button>
  </div>
  <hr class="section-sep">
  <div class="auto-row">
    <label class="toggle">
      <input type="checkbox" id="autoRefresh" onchange="toggleAuto()">
      <span class="slider"></span>
    </label>
    <span style="font-size:13px;color:#94a3b8">自动刷新</span>
    <div>
      <label style="display:inline;margin-right:6px">间隔（秒）</label>
      <input type="number" id="interval" value="2" min="1" max="60">
    </div>
  </div>
  <div class="log" id="queryLog"></div>
</div>

<!-- Results: visual -->
<div class="card">
  <div class="card-title">活跃 Agent <span id="countBadge" style="font-size:12px;color:#64748b;font-weight:400"></span></div>
  <div id="agentList"><div class="empty-state">点击"查询"获取数据</div></div>
</div>

<!-- Results: raw JSON -->
<div class="card">
  <div class="card-title" style="display:flex;justify-content:space-between">
    原始响应
    <button class="secondary" style="padding:3px 10px;font-size:11px" onclick="copyRaw()">复制</button>
  </div>
  <pre id="rawJson">—</pre>
</div>

<script>
let _timer = null;
let _empMap = {};   // profile_name -> employee
let _currentTab = 'employees';

// ── Overview ──────────────────────────────────────────────────────────────────

async function loadOverview() {
  const sessTab = document.getElementById('tabSessions');
  sessTab.innerHTML = '<div style="padding:12px;color:#475569;font-size:13px">加载中...</div>';
  try {
    const [empRes, sessRes, statusRes] = await Promise.all([
      fetch('/api/employees'),
      fetch('/api/sessions'),
      fetch('/api/agent/status'),
    ]);

    // Debug: show raw status if not OK
    if (!sessRes.ok) {
      sessTab.innerHTML = `<div style="padding:12px;color:#fca5a5;font-size:13px">
        /api/sessions 返回 ${sessRes.status}，可能需要登录或服务未启动。
      </div>`;
      setConn(false);
      return;
    }

    const empData  = await empRes.json();
    const sessData = await sessRes.json();
    const statusData = await statusRes.json();

    const emps = empData.employees || [];
    _empMap = {};
    emps.forEach(e => { _empMap[e.profile_name] = e; });

    renderEmployees(emps, statusData);
    renderSessions(sessData.sessions || [], statusData);
    renderStreams(statusData);
    setConn(true);
    addLog('ok', `总览加载完成：${emps.length} 员工，${(sessData.sessions||[]).length} 会话，${(statusData.agents||[]).length} 活跃 stream`);
  } catch(e) {
    setConn(false);
    sessTab.innerHTML = `<div style="padding:12px;color:#fca5a5;font-size:13px">加载失败: ${escHtml(String(e))}</div>`;
    addLog('err', 'loadOverview: ' + e);
  }
}

function renderEmployees(emps, statusData) {
  const el = document.getElementById('tabEmployees');
  if (!emps.length) { el.innerHTML = '<div class="empty-state">暂无数字员工</div>'; return; }

  // Build active session_id set per profile_name
  const activeProfiles = new Set((statusData.agents || []).map(a => {
    const emp = Object.values(_empMap).find(e => e.id === a.session_id || e.profile_name === a.session_id);
    return emp ? emp.profile_name : null;
  }).filter(Boolean));

  el.innerHTML = `<table>
    <thead><tr>
      <th>名称</th><th>Agent Provider</th><th>Profile</th><th>能力</th><th>状态</th>
    </tr></thead>
    <tbody>${emps.map(e => {
      const provider = e.agent_provider || 'hermes';
      const isActive = activeProfiles.has(e.profile_name);
      const caps = Object.entries(e.capabilities || {}).filter(([,v])=>v).map(([k])=>k).join(', ') || '—';
      return `<tr>
        <td style="font-weight:500;color:#f1f5f9">${escHtml(e.name || '—')}</td>
        <td><span class="pill pill-${provider}">${provider}</span></td>
        <td class="mono">${escHtml(e.profile_name || '—')}</td>
        <td style="font-size:12px;color:#64748b">${escHtml(caps)}</td>
        <td>${isActive
          ? '<span class="pill pill-active">运行中</span>'
          : '<span class="pill pill-idle">空闲</span>'}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function renderSessions(sessions, statusData) {
  const el = document.getElementById('tabSessions');
  if (!sessions.length) {
    el.innerHTML = `<div class="empty-state">
      暂无会话<br>
      <span style="font-size:12px;color:#475569;margin-top:6px;display:block">
        数据来源：GET /api/sessions → sessions[]<br>
        存储路径：~/.hermes/webui/sessions/*.json
      </span>
    </div>`;
    return;
  }

  const activeStreamSids = new Set((statusData.agents || []).map(a => a.session_id));

  // Filter controls
  const filterHtml = `
    <div class="filter-row">
      <input id="sessSearch" placeholder="搜索 session_id / 标题 / 员工..." oninput="filterSessions()" style="width:240px">
      <select id="sessProviderFilter" onchange="filterSessions()">
        <option value="">全部 Provider</option>
        <option value="hermes">Hermes</option>
        <option value="openclaw">OpenClaw</option>
      </select>
      <select id="sessStatusFilter" onchange="filterSessions()">
        <option value="">全部状态</option>
        <option value="active">运行中</option>
        <option value="idle">空闲</option>
      </select>
      <span id="sessCount" style="font-size:12px;color:#475569;margin-left:4px"></span>
    </div>`;

  const rows = sessions.map(s => {
    const emp = _empMap[s.profile] || null;
    const provider = emp ? (emp.agent_provider || 'hermes') : (s.profile ? 'hermes' : '');
    const empName = emp ? emp.name : '';
    const isActive = activeStreamSids.has(s.session_id);
    const updated = s.updated_at ? new Date(s.updated_at * 1000).toLocaleString() : '—';
    const msgCount = (s.messages || []).length || s.message_count || 0;
    return { s, emp, provider, empName, isActive, updated, msgCount };
  });

  // Store for filtering
  window._sessRows = rows;

  el.innerHTML = filterHtml + `
    <table id="sessTable">
      <thead><tr>
        <th>Session ID <span class="source-tag">session_id</span></th>
        <th>标题</th>
        <th>Provider <span class="source-tag">employee.agent_provider</span></th>
        <th>员工 <span class="source-tag">session.profile → employee.name</span></th>
        <th>Model <span class="source-tag">session.model</span></th>
        <th>消息数</th>
        <th>状态</th>
        <th>更新时间</th>
        <th></th>
      </tr></thead>
      <tbody id="sessTableBody"></tbody>
    </table>
    <div id="sessDetail"></div>`;

  renderSessionRows(rows);
}

function renderSessionRows(rows) {
  const search = (document.getElementById('sessSearch') || {}).value || '';
  const provFilter = (document.getElementById('sessProviderFilter') || {}).value || '';
  const statusFilter = (document.getElementById('sessStatusFilter') || {}).value || '';

  const filtered = rows.filter(r => {
    if (provFilter && r.provider !== provFilter) return false;
    if (statusFilter === 'active' && !r.isActive) return false;
    if (statusFilter === 'idle' && r.isActive) return false;
    if (search) {
      const q = search.toLowerCase();
      return (r.s.session_id||'').includes(q) ||
             (r.s.title||'').toLowerCase().includes(q) ||
             (r.empName||'').toLowerCase().includes(q) ||
             (r.s.profile||'').includes(q);
    }
    return true;
  });

  const el = document.getElementById('sessTableBody');
  if (!el) return;
  const countEl = document.getElementById('sessCount');
  if (countEl) countEl.textContent = `共 ${filtered.length} 条`;

  el.innerHTML = filtered.slice(0, 60).map(({s, provider, empName, isActive, updated, msgCount}) => `
    <tr onclick="loadSessionDetail('${escHtml(s.session_id)}')" style="cursor:pointer">
      <td class="mono" style="color:#818cf8">${escHtml(s.session_id||'—')}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(s.title||'Untitled')}</td>
      <td>${provider ? `<span class="pill pill-${provider}">${provider}</span>` : '<span style="color:#475569">—</span>'}</td>
      <td style="font-size:12px">${escHtml(empName||'—')}</td>
      <td class="mono" style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml((s.model||'—'))}</td>
      <td style="text-align:center;color:#64748b">${msgCount}</td>
      <td>${isActive ? '<span class="pill pill-active">运行中</span>' : '<span class="pill pill-idle">空闲</span>'}</td>
      <td style="font-size:11px;color:#475569;white-space:nowrap">${updated}</td>
      <td><button class="secondary" style="padding:2px 8px;font-size:11px" onclick="event.stopPropagation();copyVal('${escHtml(s.session_id)}')">复制ID</button></td>
    </tr>`).join('');
}

function filterSessions() {
  if (window._sessRows) renderSessionRows(window._sessRows);
}

async function loadSessionDetail(sid) {
  const el = document.getElementById('sessDetail');
  el.innerHTML = '<div style="padding:12px;color:#475569;font-size:13px">加载中...</div>';
  try {
    const res = await fetch('/api/session?session_id=' + encodeURIComponent(sid));
    const data = await res.json();
    const s = data.session;
    if (!s) { el.innerHTML = '<div style="padding:12px;color:#fca5a5;font-size:13px">加载失败</div>'; return; }

    const emp = _empMap[s.profile] || null;
    const provider = emp ? (emp.agent_provider || 'hermes') : (s.profile ? 'hermes' : '—');
    const msgs = (s.messages || []).slice(-6);

    el.innerHTML = `<div class="sess-detail">
      <div class="sess-detail-title">
        Session 详情
        <button class="secondary" style="padding:2px 8px;font-size:11px" onclick="document.getElementById('sessDetail').innerHTML=''">关闭</button>
      </div>

      <div class="field-row">
        <span class="field-key">session_id</span>
        <span class="field-val copy-btn" onclick="copyVal('${escHtml(s.session_id)}')">${escHtml(s.session_id)}</span>
        <span class="source-tag">GET /api/session?session_id=</span>
      </div>
      <div class="field-row">
        <span class="field-key">title</span>
        <span class="field-val">${escHtml(s.title||'—')}</span>
        <span class="source-tag">session.title</span>
      </div>
      <div class="field-row">
        <span class="field-key">agent_provider</span>
        <span class="field-val"><span class="pill pill-${provider}">${provider}</span></span>
        <span class="source-tag">employee.agent_provider (via session.profile → /api/employees)</span>
      </div>
      <div class="field-row">
        <span class="field-key">profile</span>
        <span class="field-val copy-btn" onclick="copyVal('${escHtml(s.profile||'')}')">${escHtml(s.profile||'—')}</span>
        <span class="source-tag">session.profile = employee.profile_name</span>
      </div>
      <div class="field-row">
        <span class="field-key">employee_id</span>
        <span class="field-val copy-btn" onclick="copyVal('${escHtml(emp ? emp.id : '')}')">${escHtml(emp ? emp.id : '—')}</span>
        <span class="source-tag">employee.id (lookup by profile_name)</span>
      </div>
      <div class="field-row">
        <span class="field-key">model</span>
        <span class="field-val copy-btn" onclick="copyVal('${escHtml(s.model||'')}')">${escHtml(s.model||'—')}</span>
        <span class="source-tag">session.model → POST /api/chat/start { model }</span>
      </div>
      <div class="field-row">
        <span class="field-key">workspace</span>
        <span class="field-val">${escHtml(s.workspace||'—')}</span>
        <span class="source-tag">session.workspace → POST /api/chat/start { workspace }</span>
      </div>
      <div class="field-row">
        <span class="field-key">personality</span>
        <span class="field-val">${escHtml(s.personality||'—')}</span>
        <span class="source-tag">session.personality</span>
      </div>
      <div class="field-row">
        <span class="field-key">消息数</span>
        <span class="field-val">${(s.messages||[]).length}</span>
        <span class="source-tag">session.messages.length</span>
      </div>
      <div class="field-row">
        <span class="field-key">input_tokens</span>
        <span class="field-val">${s.input_tokens||0}</span>
        <span class="source-tag">session.input_tokens</span>
      </div>
      <div class="field-row">
        <span class="field-key">output_tokens</span>
        <span class="field-val">${s.output_tokens||0}</span>
        <span class="source-tag">session.output_tokens</span>
      </div>

      <div style="margin-top:12px;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">
        最近消息（最后 ${msgs.length} 条）
        <span class="source-tag">session.messages[]</span>
      </div>
      <div class="msg-preview">
        ${msgs.length ? msgs.map(m => `
          <div class="msg-row ${m.role}">
            <div class="msg-role">${escHtml(m.role)}</div>
            ${escHtml(typeof m.content === 'string' ? m.content.slice(0,200) : JSON.stringify(m.content).slice(0,200))}${(typeof m.content === 'string' ? m.content : '').length > 200 ? '…' : ''}
          </div>`).join('') : '<div style="color:#475569;font-size:12px">暂无消息</div>'}
      </div>

      <div style="margin-top:14px;padding-top:12px;border-top:1px solid #2d3148;display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="fillSession('${escHtml(s.session_id)}')" style="font-size:12px;padding:5px 12px">用此 session_id 查询 Agent 状态</button>
        <button class="secondary" onclick="copyVal(JSON.stringify(${JSON.stringify({session_id: s.session_id, model: s.model, workspace: s.workspace, profile: s.profile})}, null, 2))" style="font-size:12px;padding:5px 12px">复制 chat/start 参数</button>
      </div>
    </div>`;
  } catch(e) {
    el.innerHTML = `<div style="padding:12px;color:#fca5a5;font-size:13px">${escHtml(String(e))}</div>`;
  }
}

function renderStreams(statusData) {
  const el = document.getElementById('tabStreams');
  const agents = statusData.agents || [];
  if (!agents.length) { el.innerHTML = '<div class="empty-state">当前没有活跃的 Stream</div>'; return; }

  el.innerHTML = `<table>
    <thead><tr>
      <th>Stream ID</th><th>Agent Provider</th><th>Session ID</th><th>Model</th><th>运行时长</th>
    </tr></thead>
    <tbody>${agents.map(a => {
      const provider = a.provider || '—';
      return `<tr>
        <td class="mono clickable" onclick="fillStream('${escHtml(a.stream_id)}')">${escHtml((a.stream_id||'').slice(0,16))}…</td>
        <td><span class="pill pill-${provider}">${provider}</span></td>
        <td class="mono clickable" onclick="fillSession('${escHtml(a.session_id||'')}')">${escHtml((a.session_id||'').slice(0,16))}…</td>
        <td class="mono" style="font-size:11px">${escHtml((a.model||'—').slice(0,24))}</td>
        <td><span class="pill pill-active">${a.elapsed_seconds != null ? a.elapsed_seconds+'s' : '—'}</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function switchTab(name, btn) {
  _currentTab = name;
  ['employees','sessions','streams'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = t === name ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function fillStream(id) {
  document.getElementById('filterStream').value = id;
  document.getElementById('filterSession').value = '';
  fetchStatus();
  window.scrollTo({top: document.getElementById('queryCard').offsetTop - 16, behavior: 'smooth'});
}

function fillSession(id) {
  document.getElementById('filterSession').value = id;
  document.getElementById('filterStream').value = '';
  fetchStatus();
  window.scrollTo({top: document.getElementById('queryCard').offsetTop - 16, behavior: 'smooth'});
}

// ── Agent status query ────────────────────────────────────────────────────────

function buildUrl() {
  const s = document.getElementById('filterStream').value.trim();
  const sess = document.getElementById('filterSession').value.trim();
  let url = '/api/agent/status';
  const params = [];
  if (s) params.push('stream_id=' + encodeURIComponent(s));
  if (sess) params.push('session_id=' + encodeURIComponent(sess));
  if (params.length) url += '?' + params.join('&');
  return url;
}

async function fetchStatus() {
  const url = buildUrl();
  try {
    const res = await fetch(url);
    const data = await res.json();
    setConn(true);
    document.getElementById('lastUpdate').textContent = '最后更新: ' + new Date().toLocaleTimeString();
    renderAgents(data);
    document.getElementById('rawJson').textContent = JSON.stringify(data, null, 2);
    addLog('ok', `${url} → ${res.status} (${data.count} agents)`);
  } catch (e) {
    setConn(false);
    document.getElementById('rawJson').textContent = String(e);
    addLog('err', String(e));
  }
}

function setConn(ok) {
  document.getElementById('connDot').className = 'dot' + (ok ? ' active' : '');
  const t = document.getElementById('connText');
  t.textContent = ok ? '已连接' : '连接失败';
  t.style.color = ok ? '#86efac' : '#fca5a5';
}

function renderAgents(data) {
  const list = document.getElementById('agentList');
  const count = data.count || 0;
  document.getElementById('countBadge').textContent = count > 0 ? `(${count} 个运行中)` : '(无)';

  if (!count) {
    list.innerHTML = '<div class="empty-state">当前没有活跃的 Agent</div>';
    return;
  }

  list.innerHTML = data.agents.map(a => {
    const providerBadge = a.provider === 'hermes'
      ? '<span class="badge badge-hermes">Hermes</span>'
      : '<span class="badge badge-openclaw">OpenClaw</span>';
    const stats = buildStats(a);
    return `
      <div class="agent-card">
        <div class="agent-header">
          <span class="badge badge-running">running</span>
          ${providerBadge}
          <span style="font-size:13px;font-weight:600;color:#f1f5f9">${escHtml(a.model || '—')}</span>
          <span class="stream-id">stream: ${escHtml(a.stream_id || '—')}</span>
        </div>
        <div class="stats-grid">${stats}</div>
      </div>`;
  }).join('');
}

function buildStats(a) {
  const s = a.agent_status || {};
  const elapsed = a.elapsed_seconds != null ? a.elapsed_seconds + 's' : '—';
  const sessionId = a.session_id ? a.session_id.slice(0, 12) + '…' : '—';
  const common = [stat('运行时长', elapsed, true), stat('Session', sessionId)];

  if (a.provider === 'hermes') {
    return [...common,
      stat('输入 Token', fmt(s.input_tokens)),
      stat('输出 Token', fmt(s.output_tokens)),
      stat('预估费用', s.estimated_cost_usd != null ? '$' + s.estimated_cost_usd.toFixed(4) : '—'),
      stat('上下文长度', fmt(s.context_length)),
      stat('压缩次数', fmt(s.compression_count)),
      stat('最近 Prompt', fmt(s.last_prompt_tokens)),
    ].join('');
  } else {
    return [...common,
      stat('Agent ID', s.openclaw_agent_id || '—'),
      stat('Gateway', s.gateway_url || '—'),
      stat('已中断', s.interrupted ? '是' : '否'),
      stat('输入 Token', fmt(s.input_tokens)),
      stat('输出 Token', fmt(s.output_tokens)),
    ].join('');
  }
}

function stat(label, value, highlight) {
  return `<div class="stat">
    <div class="stat-label">${label}</div>
    <div class="stat-value${highlight ? ' highlight' : ''}">${escHtml(String(value ?? '—'))}</div>
  </div>`;
}

function fmt(v) { return v != null ? v.toLocaleString() : '—'; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function copyVal(text) {
  navigator.clipboard.writeText(text).catch(() => {});
  const t = document.getElementById('copyToast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function addLog(type, msg) {
  const log = document.getElementById('queryLog');
  const el = document.createElement('div');
  el.className = 'log-entry ' + type;
  el.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  log.prepend(el);
  while (log.children.length > 20) log.removeChild(log.lastChild);
}

function clearFilters() {
  document.getElementById('filterStream').value = '';
  document.getElementById('filterSession').value = '';
}

function toggleAuto() {
  const on = document.getElementById('autoRefresh').checked;
  if (_timer) { clearInterval(_timer); _timer = null; }
  if (on) {
    const sec = parseInt(document.getElementById('interval').value) || 2;
    fetchStatus();
    _timer = setInterval(fetchStatus, sec * 1000);
  }
}

function copyRaw() {
  copyVal(document.getElementById('rawJson').textContent);
}

// Auto-load overview on page open
loadOverview();
</script>
